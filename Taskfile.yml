# Taskfile for dataflow-cli
# Install: https://taskfile.dev/install
# Run: task build | task run -- run path/to/manifest.yaml

version: '3'

vars:
  BINARY: bin/dataflow-cli
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev
  LDFLAGS: -s -w -X github.com/dataflow-operator/dataflow-cli/cmd.Version={{.VERSION}}

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  build:
    desc: Build dataflow-cli binary locally
    cmds:
      - mkdir -p bin
      - go build -trimpath -ldflags "{{.LDFLAGS}}" -o {{.BINARY}} .

  run:
    desc: "Run dataflow-cli without building (go run). Use: task run -- run path/to/manifest.yaml"
    cmds:
      - go run . {{.CLI_ARGS}}

  docker:
    desc: Build the CLI image from this module
    cmds:
      - docker build -t dataflow-cli .
